name: Changelog

on:
  pull_request:
    branches: [ main ]
    # Labeling re-runs the check, so the "no changelog" label takes effect at once
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

jobs:
  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require an entry under Unreleased for changes to the package
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Changes to the package or its dependencies reach users; tests, docs and CI do not need an entry
          if ! git diff --name-only "$BASE" HEAD -- src pyproject.toml | grep -q .; then
            echo "No changes to src/ or pyproject.toml: no changelog entry needed."
            exit 0
          fi
          unreleased() {
            git show "$1:CHANGELOG.md" 2>/dev/null | awk '/^## \[Unreleased\]/ {found = 1; next} /^## \[/ {found = 0} found'
          }
          # A new non-blank line under Unreleased; removals or reordering do not count
          if ! diff <(unreleased "$BASE") <(unreleased HEAD) | grep -q '^> *[^ ]'; then
            echo "::error file=CHANGELOG.md::This pull request changes src/ or pyproject.toml but adds nothing under '## [Unreleased]' in CHANGELOG.md. Describe the change there, or add the 'no changelog' label if users will not notice it."
            exit 1
          fi
          echo "CHANGELOG.md has a new entry under Unreleased."
