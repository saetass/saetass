name: Documentation
description: Something in the documentation, tutorials or examples is wrong, unclear or missing.
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Page
      description: The link to the page, tutorial or docstring.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong, unclear or missing, and what it should say instead if you know.
    validations:
      required: true
